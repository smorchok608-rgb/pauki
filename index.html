<style>
:root{--bg:#161513;--ink:#d9d3c7;--dim:#8f897d;--gold:#e8b84a;--red:#d8574a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 8px 20px}

<script>
//CORE
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=5,S=10,N=1+R*S;
const id=(r,s)=>r==0?0:1+(r-1)*S+(((s%S)+S)%S);
const rc=n=>n==0?[0,0]:[1+(((n-1)/S)|0),(n-1)%S];
const ek=(a,b)=>a<b?a*100+b:b*100+a;
function allN(n){const[r,s]=rc(n),o=[];if(r==0){for(let k=0;k<S;k++)o.push(id(1,k));return o}
o.push(id(r,s+1),id(r,s-1),r==1?0:id(r-1,s));if(r<R)o.push(id(r+1,s));return o}
function shuf(a,f){for(let i=a.length-1;i>0;i--){const j=(f()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function gen(seed){
const f=rng(seed),E=new Set(),adj=Array.from({length:N},()=>[]);
const add=(a,b)=>{E.add(ek(a,b));adj[a].push(b);adj[b].push(a)};
const vis=new Set([0]),st=[0];
while(st.length){const n=st[st.length-1];const c=shuf(allN(n).filter(x=>!vis.has(x)),f);
if(!c.length){st.pop();continue}vis.add(c[0]);add(n,c[0]);st.push(c[0])}
const rest=[];for(let n=0;n<N;n++)for(const m of allN(n))if(n<m&&!E.has(ek(n,m)))rest.push([n,m]);
shuf(rest,f).slice(0,12).forEach(([a,b])=>add(a,b));
const paths=[];let guard=0;
while(paths.length<5&&guard++<800){
const s=1+S+((f()*(N-1-S))|0),L=3+((f()*4)|0),p=[s];
while(p.length<L){const c=adj[p[p.length-1]].filter(x=>x&&!p.includes(x));if(!c.length)break;p.push(c[(f()*c.length)|0])}
if(p.length>=3&&!paths.some(q=>q[0]==p[0]))paths.push(p)}
return{adj,E,paths,seed}}
function sp(P,t){const L=P.length,per=2*(L-1),m=t%per;return P[m<L?m:per-m]}
function safe(Lv,a,b,t){ // fly a->b during step t->t+1
for(const P of Lv.paths){const x=sp(P,t),y=sp(P,t+1);if(b==y||(a==y&&b==x))return false}return true}
function solve(Lv){const exit=id(R,0);let cur=new Set(['0,0']);
for(let t=0;t<70;t++){const nx=new Set();
for(const k of cur){const[n,w]=k.split(',').map(Number);
if(n==exit)return t+1;
for(const m of [n,...Lv.adj[n]]){const w2=w+(m==n?1:0);if(w2>2||!safe(Lv,n,m,t))continue;nx.add(m+','+w2)}}
cur=nx}
return -1}
function gd(Lv){const e=id(R,0),d=new Map([[0,0]]),q=[0];for(let i=0;i<q.length;i++)for(const m of Lv.adj[q[i]])if(!d.has(m)){d.set(m,d.get(q[i])+1);q.push(m)}return d.get(e)+1}

g.lineCap='round';
const E=edgesList();E.push([EXIT,-1]);
const P=n=>n<0?[560,C]:pos(n);
g.lineWidth=1;g.strokeStyle='rgba(255,255,255,.1)';for(let n=0;n<N;n++)for(const m of allN(n))if(n<m&&!Lv.E.has(ek(n,m))){const p=pos(n),q=pos(m);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()}
for(const[w,c,col]of[[7,'rgba(8,10,14,.7)'],[4.2,'rgba(255,255,255,.3)'],[1.7,'#fff']]){g.lineWidth=w;g.strokeStyle=col;
for(const[a,b]of E){const p=P(a),q=P(b);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()}}
for(let n=0;n<N;n++){const p=pos(n);g.fillStyle='rgba(255,255,255,.95)';g.beginPath();g.arc(p[0],p[1],2.4,0,7);g.fill()}
// exit arrow
disc([562,C],40,'255,190,80',state=='won'?.65:.3);
g.fillStyle='#5a5750';g.fillRect(14,C-1,0,0);
// next-spider marks
if(state=='play'&&!anim)for(const P2 of Lv.paths){const p=pos(sp(P2,t+1));g.strokeStyle='rgba(216,87,74,.8)';g.lineWidth=2.5;g.beginPath();g.arc(p[0],p[1],13,0,7);g.stroke()}
Lv.paths.forEach((P2,i)=>{const p=sps[i];disc(p,26,'255,60,40',.6);g.save();g.shadowColor='rgba(255,90,40,.9)';g.shadowBlur=16;spr(IMG.sp,p[0],p[1],38,curHS[i]-Math.PI/2);g.restore()});
disc(fp,28,'255,225,140',state=='dead'||state=='over'?.2:.8);
g.save();g.globalAlpha=(state=='dead'||state=='over'?.55:1)*curFA;g.shadowColor=state=='dead'||state=='over'?'#d8574a':'#ffd27a';g.shadowBlur=16;spr(IMG.fly,fp[0],fp[1],curFS,curHF+Math.PI/2);g.restore();
g.textAlign='center';g.textBaseline='middle';
if(state=='dead'||state=='over'){g.fillStyle='rgba(150,20,10,.25)';g.fillRect(0,0,W,W)}
if(state=='over'){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,W);g.fillStyle='#fff';g.font='bold 44px Georgia,serif';g.textAlign='center';g.textBaseline='middle';g.fillText('Конец игры',C,C)}}
function lerp(a,b,k){return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}
function frame(now){
if(!IMG.ok){requestAnimationFrame(frame);return}
let k=1,fp,sps;
if(anim){const du=anim.exit?650:240;k=Math.min(1,(now-anim.t0)/du);k=k*k*(3-2*k);
fp=lerp(pos(anim.f0),anim.exit?[562,C]:pos(anim.f1),k);
sps=Lv.paths.map(P=>lerp(pos(sp(P,anim.t0n)),pos(sp(P,anim.t0n+1)),k));
if(now-anim.t0>=du){const a=anim;anim=null;fly=a.exit?EXIT:a.f1;t=a.t0n+1;
 if(a.exit){state='won';doorT=now;say('🔓 Замок открыт! Муха на свободе.')}
 else if(a.dead){lives--;if(lives<=0){state='over';say('Конец игры. Нажми на дверь.')}else{state='dead';say('Паук поймал муху.');setTimeout(()=>{if(state=='dead')respawn('Ещё попытка.')},1100)}}}}
if(!anim){fp=pos(fly);sps=Lv.paths.map(P=>pos(sp(P,t)))}
curHF=flyAng;curFS=anim&&anim.exit?34*(1-.5*k):34;curFA=anim&&anim.exit?1-.7*k:1;if(state=='won'&&!anim)fp=[-99,-99];const hd=(P,tt)=>{const a=pos(sp(P,tt)),b=pos(sp(P,tt+1));return Math.atan2(b[1]-a[1],b[0]-a[0])};
curHS=Lv.paths.map(P=>{if(!anim)return hd(P,t);const a=hd(P,anim.t0n),b=hd(P,anim.t0n+1);let d=b-a;d=Math.atan2(Math.sin(d),Math.cos(d));return a+d*Math.max(0,Math.min(1,(k-.45)/.55))});
g.clearRect(0,0,W,W);
if(state=='won'&&!anim){const o=Math.min(1,(now-doorT)/1600),e=1-Math.pow(1-o,3);
const gr=g.createRadialGradient(C,C,10,C,C,W*.7);gr.addColorStop(0,'#fff3c4');gr.addColorStop(1,'#d8a23a');g.fillStyle=gr;g.fillRect(0,0,W,W);
g.save();g.beginPath();g.rect(0,0,C,W);g.clip();g.translate(-e*C,0);scene(fp,sps);g.restore();
g.save();g.beginPath();g.rect(C,0,C,W);g.clip();g.translate(e*C,0);scene(fp,sps);g.restore();
if(o>=1){g.fillStyle='#5a3d0a';g.font='bold 34px Georgia,serif';g.textAlign='center';g.fillText('Свобода!',C,C-10);g.font='20px Georgia,serif';g.fillText('за '+moves+' ходов',C,C+26)}}
else scene(fp,sps);
requestAnimationFrame(frame)}
function step(m){ // m: node, 'wait' or 'exit'
if(anim||state!='play')return;
const exit=m=='exit',to=m=='wait'||exit?fly:m;
const ok=exit||safe(Lv,fly,to,t);
if(exit&&!safe(Lv,fly,fly,t)&&false)return;
if(exit)flyAng=0;else if(to!=fly){const a=pos(fly),b=pos(to);flyAng=Math.atan2(b[1]-a[1],b[0]-a[0])}
moves++;anim={t0:performance.now(),f0:fly,f1:to,t0n:t,exit,dead:!ok};
if(ok)say(exit?'':'Ходов: '+moves)}
function dirMove(dx,dy){const p=pos(fly);let best=null,bs=.25;
const c=Lv.adj[fly].map(n=>[n,pos(n)]);if(fly==EXIT)c.push(['exit',[W,C]]);
for(const[n,q]of c){const vx=q[0]-p[0],vy=q[1]-p[1],l=Math.hypot(vx,vy)||1,d=(vx*dx+vy*dy)/l;if(d>bs){bs=d;best=n}}
if(best!==null)step(best)}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const[x,y]=b.dataset.d.split(',').map(Number);dirMove(x,y)});
document.getElementById('wait').onclick=()=>step('wait');
addEventListener('keydown',e=>{if(state=='over'){reset();return}
const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]}[e.key];
if(m){e.preventDefault();dirMove(...m)}else if(e.key==' '){e.preventDefault();step('wait')}});
cv.addEventListener('pointerdown',e=>{if(state=='over'){reset();return}
const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*W;
if(fly==EXIT&&x>pos(EXIT)[0]+20&&Math.abs(y-C)<45)return step('exit');
let best=null,bd=40;for(const n of Lv.adj[fly]){const p=pos(n),d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=n}}
if(best!==null)step(best);else if(Math.hypot(pos(fly)[0]-x,pos(fly)[1]-y)<25)step('wait')});
newLevel(45225);requestAnimationFrame(frame);
</script>
